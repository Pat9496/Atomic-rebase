name: Bug report
description: Report a problem with one of the rebase/backup/restore scripts
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much
        of this as you can — these scripts touch real system state, so
        exact details matter.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: script
    attributes:
      label: Which script and desktops?
      placeholder: e.g. ./Atomic-rebase.sh --to kinoite, from Silverblue
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `rpm-ostree status` and your current desktop.
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Backup directory contents (`settings.env`), logs, or other context.
